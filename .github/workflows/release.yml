name: Release (signed APK + AAB)

# Manual only. Needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   POOOY_KEYSTORE_BASE64    base64 of your release keystore (.jks / .p12)
#   POOOY_KEYSTORE_PASSWORD, POOOY_KEY_ALIAS, POOOY_KEY_PASSWORD
# Nothing secret is ever written to the repository; the keystore only exists on the runner during the job.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require signing secrets
        env:
          KS: ${{ secrets.POOOY_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.POOOY_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.POOOY_KEY_ALIAS }}
          KP: ${{ secrets.POOOY_KEY_PASSWORD }}
        run: |
          for v in KS KSP KA KP; do
            if [ -z "${!v}" ]; then echo "::error::Missing signing secret ($v). Refusing to build an unsigned release."; exit 1; fi
          done

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Fetch and verify pinned dependencies
        run: bash scripts/fetch-deps.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests
        run: gradle testReleaseUnitTest

      - name: Decode keystore
        env:
          KS: ${{ secrets.POOOY_KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "POOOY_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        env:
          POOOY_KEYSTORE_PASSWORD: ${{ secrets.POOOY_KEYSTORE_PASSWORD }}
          POOOY_KEY_ALIAS: ${{ secrets.POOOY_KEY_ALIAS }}
          POOOY_KEY_PASSWORD: ${{ secrets.POOOY_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          gradle assembleRelease bundleRelease \
            -Ppooy.versionCode="$RUN_NUMBER" \
            -Ppooy.versionName="$VERSION_NAME"

      - name: Verify APK signature, 16 KB alignment
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$APK"
          bash scripts/check-elf-alignment.sh "$APK"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: POOOY-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
